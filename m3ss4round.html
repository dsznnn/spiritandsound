<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FORM — Graphic Design Studio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #f3efe7;
    color: #151515;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

a:hover {
    color: #ef4b2f;
}

/* PAGE */

.page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 3vw 28px;
}

/* CENTRED NAVIGATION-ONLY PAGE */

.top,
.content,
.footer {
    display: none;
}

/* TOP */

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 30px;
    margin-bottom: 125px;
}

.artists {
    display: flex;
    gap: 12px;
    overflow-x: auto;
}

.artist {
    width: 150px;
    flex-shrink: 0;
}

.artist img {
    width: 150px;
    height: 145px;
    object-fit: cover;
    display: block;
    filter: grayscale(100%) contrast(1.2);
}

.artist-name {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

/* LOGO */

.logo {
    font-size: clamp(58px, 8vw, 128px);
    font-weight: 900;
    letter-spacing: -10px;
    line-height: .72;
    transform: scaleY(1.05);
    transform-origin: top right;
}

/* MAIN */

.main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.page-gif {
    display: block;
    max-width: min(90vw, 500px);
    height: auto;
    margin-bottom: 28px;
}

/* TEXT */

.content {
    margin-left: 10vw;
    max-width: 720px;
}

.content p {
    font-size: 18px;
    line-height: 1.28;
    margin: 0 0 40px;
}

/* NAV */

.navigation {
    width: max-content;
    margin: 0 auto;
    text-align: center;
    font-size: clamp(32px, 3.2vw, 56px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: .88;
    text-transform: uppercase;
}

.navigation a {
    display: block;
}

/* CONTACT */

.contacts {
    margin-top: 90px;
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 25px 80px;
    font-size: 14px;
}

.contacts span {
    display: block;
    margin-bottom: 5px;
}

.contacts a {
    color: #ef4b2f;
}

/* FOOTER */

.footer {
    margin-top: 130px;
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

/* MOBILE */

@media (max-width: 900px) {

    .navigation {
        text-align: center;
    }
}

@media (max-width: 550px) {

    .page {
        padding: 18px;
    }

    .artist {
        width: 105px;
    }

    .artist img {
        width: 105px;
        height: 100px;
    }

    .logo {
        font-size: 46px;
        letter-spacing: -6px;
    }

    .content p {
        font-size: 16px;
    }

    .navigation {
        font-size: 40px;
    }

    .contacts {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

    <main class="main">
        <img class="page-gif" src="file:///C:/Users/user/Downloads/3dgifmaker66333.gif" alt="">

        <nav class="navigation">

            <a href="#">Work</a>
            <a href="#">About</a>

        </nav>

    </main>

</div>

</body>
</html>
