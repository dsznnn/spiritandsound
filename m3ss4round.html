<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FORM — Graphic Design Studio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #f3efe7;
    color: #151515;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

a:hover {
    color: #ef4b2f;
}

/* PAGE */

.page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 3vw 28px;
}

/* CENTRED NAVIGATION-ONLY PAGE */

.top,
.content,
.footer {
    display: none;
}

/* TOP */

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 30px;
    margin-bottom: 125px;
}

.artists {
    display: flex;
    gap: 12px;
    overflow-x: auto;
}

.artist {
    width: 150px;
    flex-shrink: 0;
}

.artist img {
    width: 150px;
    height: 145px;
    object-fit: cover;
    display: block;
    filter: grayscale(100%) contrast(1.2);
}

.artist-name {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

/* LOGO */

.logo {
    font-size: clamp(58px, 8vw, 128px);
    font-weight: 900;
    letter-spacing: -10px;
    line-height: .72;
    transform: scaleY(1.05);
    transform-origin: top right;
}

/* MAIN */

.main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.page-gif {
    display: block;
    max-width: min(90vw, 500px);
    height: auto;
    margin-bottom: 28px;
}

/* TEXT */

.content {
    margin-left: 10vw;
    max-width: 720px;
}

.content p {
    font-size: 18px;
    line-height: 1.28;
    margin: 0 0 40px;
}

/* NAV */

.navigation {
    width: max-content;
    margin: 0 auto;
    text-align: center;
    font-size: clamp(32px, 3.2vw, 56px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: .88;
    text-transform: uppercase;
}

.navigation a {
    display: block;
    cursor: pointer;
}

/* POPUP */

.page.is-blurred {
    filter: blur(8px);
    transition: filter .2s ease;
}

.popup {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    padding: 24px;
    background: rgb(21 21 21 / 35%);
}

.popup.is-open {
    display: grid;
}

.popup.is-open .popup-window {
    animation: popup-open .35s ease-out;
}

@keyframes popup-open {
    0% {
        opacity: 0;
        transform: scale(.8) translateY(20px);
    }
    70% {
        transform: scale(1.03) translateY(0);
    }
    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.popup-window {
    position: relative;
    width: min(90vw, 620px);
    min-height: 260px;
    padding: 48px 32px 32px;
    background: #f3efe7;
    color: #151515;
    box-shadow: 0 15px 50px rgb(0 0 0 / 25%);
}

.popup-window h2 {
    margin: 0 0 18px;
    font-size: clamp(36px, 6vw, 72px);
    line-height: .9;
    text-transform: uppercase;
}

.popup-window p {
    max-width: 480px;
    font-size: 18px;
    line-height: 1.35;
}

.popup-close {
    position: absolute;
    top: 12px;
    right: 16px;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 28px;
    line-height: 1;
}

/* CONTACT */

.contacts {
    margin-top: 90px;
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 25px 80px;
    font-size: 14px;
}

.contacts span {
    display: block;
    margin-bottom: 5px;
}

.contacts a {
    color: #ef4b2f;
}

/* FOOTER */

.footer {
    margin-top: 130px;
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
}

/* MOBILE */

@media (max-width: 900px) {

    .navigation {
        text-align: center;
    }
}

@media (max-width: 550px) {

    .page {
        padding: 18px;
    }

    .artist {
        width: 105px;
    }

    .artist img {
        width: 105px;
        height: 100px;
    }

    .logo {
        font-size: 46px;
        letter-spacing: -6px;
    }

    .content p {
        font-size: 16px;
    }

    .navigation {
        font-size: 40px;
    }

    .contacts {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

    <main class="main">
        <img class="page-gif" src="3dgifmaker66333.gif" alt="">

        <nav class="navigation">

            <a href="#">Work</a>
            <a href="#">About</a>

        </nav>

    </main>

</div>

<div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <section class="popup-window">
        <button class="popup-close" type="button" aria-label="Close popup">&times;</button>
        <h2 id="popup-title"></h2>
        <p id="popup-text"></p>
    </section>
</div>

<script>
    const page = document.querySelector('.page');
    const popup = document.querySelector('#popup');
    const popupTitle = document.querySelector('#popup-title');
    const popupText = document.querySelector('#popup-text');
    const closeButton = document.querySelector('.popup-close');

    const popupContent = {
        Work: 'A selection of graphic design work and visual experiments.',
        About: 'FORM is a graphic design studio focused on clear, expressive visual identities.'
    };

    function closePopup() {
        popup.classList.remove('is-open');
        page.classList.remove('is-blurred');
        document.body.style.overflow = '';
    }

    document.querySelectorAll('.navigation a').forEach(link => {
        link.addEventListener('click', event => {
            event.preventDefault();
            popupTitle.textContent = link.textContent;
            popupText.textContent = popupContent[link.textContent] || '';
            popup.classList.add('is-open');
            page.classList.add('is-blurred');
            document.body.style.overflow = 'hidden';
        });
    });

    closeButton.addEventListener('click', closePopup);
    popup.addEventListener('click', event => {
        if (event.target === popup) closePopup();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closePopup();
    });
</script>

</body>
</html>
