<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--fg:#000;--muted:#555;--line:#000;--card:#fff;--logo-bg:#f3f3f3;--logo-fg:#000;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff;--fg:#000}}
:root[data-theme="dark"]{--bg:#fff;--fg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,120px) clamp(20px,5vw,48px)}
.back{display:inline-block;font-weight:500;margin-bottom:clamp(24px,4vw,40px)}
.back::before{content:"\2190";margin-right:8px}
h1{font-family:Archivo,"Arial Black",Impact,sans-serif;font-weight:900;font-size:clamp(3.2rem,14vw,11rem);line-height:.9;letter-spacing:-.04em;margin:0 0 clamp(40px,7vw,88px)}
.grid{display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;min-height:340px}
@media (max-width:760px){.card{grid-template-columns:1fr}.logo{min-height:220px;border-right:0;border-bottom:1px solid var(--line)}}
.logo{position:relative;border-right:1px solid var(--line);background:var(--logo-bg);color:var(--logo-fg);overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.info{padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:18px}
h2{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(1.8rem,3.5vw,2.6rem);letter-spacing:-.02em;margin:0}
p{margin:0;color:var(--muted);max-width:44ch}
.foot{margin-top:auto;padding-top:20px;border-top:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:var(--fg);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}
.site{font-weight:500}
.socials{display:flex;gap:14px;color:var(--muted)}
.socials a{color:var(--muted);display:inline-flex}
.socials a:hover{color:var(--fg)}
.socials svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">Back</a>
<h1>PROJECTS</h1>
<section class="grid">

<article class="card">
<div class="logo"><img src="solace.png" alt="Solace"></div>
<div class="info">
<h2>Solace</h2>
<p>Intimate Electronic, Afro Tech And Gqom Jols.</p>
<div class="foot">
<a class="site" href="solace.html">Solace Website</a>
<div class="socials">
<a href="https://www.instagram.com/solacejhb/" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a>
</div>
</div>
</div>
</article>

<article class="card">
<div class="logo"><img src="zenandfriends.png" alt="Zen and Friends"></div>
<div class="info">
<h2>Zen And Friends</h2>
<p>A place for Zen and his friends </p>
<div class="foot">
<a class="site" href="https://example.com">Coming soon...</a>
<div class="socials">
<a href="https://www.instagram.com/zenandfriendss/" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a>
</div>
</div>
</div>
</article>

<article class="card">
<div class="logo"><img src="zora.png" alt="Zora"></div>
<div class="info">
<h2>ZORA</h2>
<p>An african record label arriving in 2027</p>
<div class="foot">
<a class="site" href="https://example.com">Coming soon...</a>
<div class="socials">
<a href="https://instagram.com/zora__sa" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a>
</div>
</div>
</div>
</article>

</section>
</main>
</body>
</html>
